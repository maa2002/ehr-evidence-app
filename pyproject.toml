# Application package and tooling configuration.
#
# Direct dependencies only, with compatible lower bounds. The exact resolved
# versions (with hashes) are in requirements/app.lock.txt, produced with
# `uv pip compile` (see docs/development.md). The application environment
# lives outside Git, at the configured UV_PROJECT_ENVIRONMENT under the
# runtime root.
#
# Deliberately excluded: PyTorch, PyG, CUDA/NVIDIA packages, model weights
# and LLM runtimes. GNN execution uses the existing GNN environment; the LLM
# runtime is added with the generation layer.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ehr-evidence-app"
version = "1.0.0"
description = "Evidence-grounded EHR question answering and explanation of inherited GNN predictions (research prototype)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "pydantic>=2.8,<3",
    "requests>=2.32",
    "numpy>=2.0",
    "clearml>=1.16",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ehr_evidence_app.interface" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
