<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>EHR Evidence</title>
<link rel="icon" href="/static/mark.svg?v={{version}}" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{version}}">
<script type="module" src="/static/app.js?v={{version}}"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar" aria-label="Patients">
    <div class="brand">
      <svg class="mark" aria-hidden="true" focusable="false"><use href="#i-mark"></use></svg>
      <span class="brand-name">EHR Evidence</span>
      <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Close the patient list">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
      </button>
    </div>
    <button class="new-conversation" id="new-conversation" type="button">
      <span class="new-disc"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-compose"></use></svg></span>
      <span>New conversation</span>
    </button>
    <div class="sidebar-field">
      <label class="field-label" for="case-set">Cohort</label>
      <div class="select-wrap">
        <select class="select" id="case-set"></select>
        <svg class="icon select-chevron" aria-hidden="true" focusable="false"><use href="#i-chevron"></use></svg>
      </div>
    </div>
    <div class="search">
      <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-search"></use></svg>
      <input id="case-filter" type="search" placeholder="Find a patient or case" autocomplete="off" spellcheck="false" aria-label="Find a patient or case">
    </div>
    <p class="field-label cases-label" id="cases-label">Patients</p>
    <nav class="case-list" id="case-list" aria-labelledby="cases-label"></nav>
    <div class="sidebar-foot">
      <p>Names are pseudonyms: the records hold no names.</p>
      <p id="version">EHR Evidence</p>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main is-empty" id="main">
    <header class="topbar">
      <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open the patient list" aria-controls="sidebar">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-menu"></use></svg>
      </button>
      <div class="case-heading">
        <h1 id="case-title">Loading</h1>
        <p id="case-detail"></p>
      </div>
      <button class="ghost-button" id="evidence-button" type="button" aria-controls="panel" aria-expanded="false" disabled>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-panel"></use></svg>
        <span>Evidence</span>
      </button>
    </header>

    <section class="conversation" id="conversation" aria-label="Conversation">
      <div class="banner" id="banner" role="alert" hidden>
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-alert"></use></svg>
        <p id="banner-text"></p>
        <button class="text-button" id="banner-retry" type="button">Try again</button>
      </div>
      <div class="welcome" id="welcome">
        <svg class="mark" aria-hidden="true" focusable="false"><use href="#i-mark"></use></svg>
        <h2 id="welcome-title">Opening the records</h2>
        <p id="welcome-detail"></p>
      </div>
      <ol class="thread" id="thread"></ol>
    </section>

    <div class="dock">
      <form class="composer" id="composer" autocomplete="off" novalidate>
        <label class="visually-hidden" for="question">Question</label>
        <textarea id="question" rows="1" maxlength="500" placeholder="Ask which conditions are recorded, or whether one is" disabled></textarea>
        <div class="composer-bar">
          <label class="tool scope-tool" title="The records a question is answered from">
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-layers"></use></svg>
            <span class="visually-hidden">Scope</span>
            <select id="scope" aria-label="Scope" disabled></select>
            <svg class="icon tool-chevron" aria-hidden="true" focusable="false"><use href="#i-chevron"></use></svg>
          </label>
          <button class="tool" id="explain" type="button" disabled>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-bulb"></use></svg>
            <span class="tool-text">Explain the prediction</span>
          </button>
          <span class="model-state" id="model-state" data-state="unknown">
            <span class="dot" aria-hidden="true"></span>
            <span class="model-text" id="model-text">Connecting</span>
          </span>
          <button class="send" id="send" type="submit" aria-label="Ask" disabled>
            <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-arrow-up"></use></svg>
          </button>
        </div>
      </form>
      <div class="suggestions" id="suggestions">
        <button class="chip" type="button" data-question="Which conditions are recorded?">Which conditions are recorded?</button>
        <button class="chip" id="suggest-explain" type="button" hidden>Explain the prediction</button>
        <button class="chip" id="suggest-evidence" type="button">Show the evidence</button>
      </div>
      <p class="footnote">Answers come only from this case's records within the selected scope. Scores are uncalibrated and are not clinical risks.</p>
    </div>
    <p class="visually-hidden" id="announce" aria-live="polite"></p>
  </main>

  <aside class="panel" id="panel" aria-label="Evidence" hidden>
    <header class="panel-head">
      <div class="panel-title">
        <span class="kicker">Evidence</span>
        <div class="select-wrap">
          <select class="select select-quiet" id="evidence-key" aria-label="Show the evidence of"></select>
          <svg class="icon select-chevron" aria-hidden="true" focusable="false"><use href="#i-chevron"></use></svg>
        </div>
      </div>
      <button class="icon-button" id="panel-close" type="button" aria-label="Close the evidence">
        <svg class="icon" aria-hidden="true" focusable="false"><use href="#i-close"></use></svg>
      </button>
    </header>
    <div class="panel-body" id="panel-body"></div>
  </aside>
</div>

<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-mark" viewBox="0 0 32 32">
    <rect width="32" height="32" rx="9" fill="currentColor" stroke="none"></rect>
    <path d="M9.5 11.5h13M9.5 16h9M9.5 20.5h5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"></path>
    <circle cx="21.5" cy="20.5" r="2.2" fill="#fff" stroke="none"></circle>
  </symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"></path></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"></circle><path d="m20 20-4.2-4.2"></path></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"></rect><path d="M14.5 4.5v15"></path></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5.5M6.5 11 12 5.5l5.5 5.5"></path></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 4 8.5 4.25L12 12.5 3.5 8.25z"></path><path d="m3.5 12.25 8.5 4.25 8.5-4.25"></path><path d="m3.5 16.25 8.5 4.25 8.5-4.25"></path></symbol>
  <symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9.5 18h5M10.5 21h3"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1v.1h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"></path></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11" height="11" rx="2"></rect><path d="M15.5 8.5v-2a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2"></path></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"></path></symbol>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"></path><path d="M4.5 4.5v4h4"></path></symbol>
  <symbol id="i-compose" viewBox="0 0 24 24"><path d="M12 20h8"></path><path d="M16.5 4a2.1 2.1 0 0 1 3 3L8 18.5l-4 1 1-4z"></path></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"></path></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19z"></path><path d="M12 10v4.5M12 17.5v.01"></path></symbol>
</svg>
</body>
</html>
